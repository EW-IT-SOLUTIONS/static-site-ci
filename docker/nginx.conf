# Servidor dos sites estáticos. Substitui o default.conf da imagem nginx-unprivileged.
#
# Reproduz o comportamento da Vercel com "cleanUrls": true e "trailingSlash": false:
#   /implante            -> serve implante.html
#   /termos-de-uso       -> serve termos-de-uso/index.html
#   /implante.html       -> 301 /implante              (preserva ?utm_... e demais parâmetros)
#   /pasta/index.html    -> 301 /pasta
#   /index.html          -> 301 /
#   /implante/           -> 301 /implante
#
# Os redirects saem relativos (absolute_redirect off), então funcionam atrás do
# Traefik e da Cloudflare sem o nginx precisar saber o domínio nem se é https.

# Cache por tipo de conteúdo. HTML sempre revalida, para uma publicação nova
# aparecer na hora; imagens e fontes ficam 7 dias no navegador.
map $sent_http_content_type $cache_control {
    default         "public, max-age=3600";
    ~*text/html     "no-cache";
    ~*^image/       "public, max-age=604800";
    ~*font          "public, max-age=604800";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript text/plain image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Sondas do Kubernetes e conferência da versão publicada (/version.txt é gerado no build).
    # no-store: nem navegador nem Cloudflare guardam, senão a pipeline leria versão velha.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /version.txt {
        add_header Cache-Control "no-store" always;
    }

    # Arquivos ocultos nunca são servidos (a imagem já não leva .git, mas fica a trava).
    location ~ /\. {
        return 404;
    }

    # cleanUrls: /index.html -> /
    location = /index.html {
        return 301 /$is_args$args;
    }

    # cleanUrls: /pagina.html -> /pagina   e   /pasta/index.html -> /pasta
    location ~ ^(?<sem_html>.+?)(?:/index)?\.html$ {
        return 301 $sem_html$is_args$args;
    }

    # trailingSlash false: /pagina/ -> /pagina   (a raiz "/" não entra: o padrão exige algo antes da barra)
    location ~ ^(?<sem_barra>.+)/$ {
        return 301 $sem_barra$is_args$args;
    }

    # Resolve a URL limpa: arquivo exato, depois pagina.html, depois pasta/index.html.
    # O try_files serve o arquivo encontrado aqui mesmo, sem passar de novo pelos
    # redirects acima, por isso não há laço.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
